name: macOS Compile Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/macos-verify.yml"
      - "app/**"
  push:
    paths:
      - ".github/workflows/macos-verify.yml"
      - "app/**"

permissions:
  contents: read

jobs:
  verify-macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            expected-arch: arm64
          - name: Intel
            runner: macos-15-intel
            expected-arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: rustup update stable --no-self-update

      - name: Record toolchain and architecture
        run: |
          architecture="$(uname -m)"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          echo "$architecture"
          echo "$rustc_version"
          echo "$cargo_version"
          echo "::notice title=macOS runner::arch=$architecture; $rustc_version; $cargo_version"
          test "$architecture" = "${{ matrix.expected-arch }}"

      - name: Check Rust backend
        working-directory: app/src-tauri
        run: |
          set -o pipefail
          cargo check --locked 2>&1 | tee cargo-check.log

      - name: Publish Rust check diagnostics
        if: failure()
        working-directory: app/src-tauri
        run: |
          diagnostic="$(tail -n 50 cargo-check.log)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=cargo check diagnostics::$diagnostic"

      - name: Test Rust backend
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Type-check frontend
        working-directory: app
        run: npm run typecheck

      - name: Compile macOS Tauri application
        working-directory: app
        run: npm run build:mac
