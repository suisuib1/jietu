[package]
name = "litesnap"
version = "2.0.1"
description = "A lightweight native screenshot utility"
authors = ["LiteSnap"]
edition = "2024"

[lib]
name = "litesnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
directories = "6"
image = { version = "0.24", default-features = false, features = ["bmp", "png", "tiff"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
screenshots = "0.8.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-global-shortcut = "2.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
    "std",
] }
